services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6  # pinned: workflows are built and tested against this version
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Saigon
      - TZ=Asia/Saigon
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Auto-delete execution logs older than 7 days to keep disk usage small
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # Generated images are written here (shared with the dashboard, which serves /assets/*)
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/assets
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  # Source of truth for the AI workforce system (plans, tasks, executions)
  postgres:
    image: postgres:16-alpine
    container_name: wf-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=workforce
      - POSTGRES_USER=workforce
      - POSTGRES_PASSWORD=${WF_POSTGRES_PASSWORD:?set WF_POSTGRES_PASSWORD in .env}
      - TZ=Asia/Saigon
    volumes:
      - wf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sketch-card renderer for the Visual Design employee (internal network only, no host port)
  renderer:
    build: ./renderer
    image: wf-renderer:local
    container_name: wf-renderer
    restart: unless-stopped
    environment:
      - ASSETS_DIR=/data/assets
    volumes:
      - ./data/assets:/data/assets

  # Dashboard UI + API proxy (adds the API key server-side). http://localhost:3000
  dashboard:
    image: node:22-alpine
    container_name: wf-dashboard
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - N8N_WEBHOOK_BASE=http://n8n:5678/webhook/workforce
      - WORKFORCE_API_KEY=${WORKFORCE_API_KEY:?set WORKFORCE_API_KEY in .env}
      - ASSETS_DIR=/assets
      # n8n API key for the "Kết nối & tài khoản" page (pasted once in the page, kept here, never sent to browsers)
      - DASHBOARD_DATA_DIR=/data/dashboard
    volumes:
      - ./dashboard:/app:ro
      - ./data/assets:/assets:ro
      - ./data/dashboard:/data/dashboard
    depends_on:
      - n8n

volumes:
  n8n_data:
  wf_pg_data:
